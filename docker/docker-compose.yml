version: "3.8"

services:
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: fuelphp-app
    environment:
      # CSRFトークン生成に使うsalt。値はリポジトリに入れず docker/.env で与える。
      # 未設定だと空文字になるため、.env.example をコピーして必ず設定する。
      APP_TOKEN_SALT: ${APP_TOKEN_SALT:?docker/.env に APP_TOKEN_SALT を設定してください}
    ports:
      - "80:80"
    volumes:
      - ../:/var/www/html/my_fuel_project
    networks:
      - fuelphp-network

  db:
    build:
      context: ../
      dockerfile: docker/db/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shift_schedule_app
    ports:
      - "3306:3306"
    networks:
      - fuelphp-network

networks:
  fuelphp-network:
    driver: bridge
